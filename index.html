<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://site.api.espn.com https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Watch Guide — where to watch every game</title>
<link rel="preconnect" href="https://site.api.espn.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0A0C11">
<meta name="description" content="Find where every game is airing, with hand-verified prices for every way to watch.">
<style>
/* ============================================================
   DESIGN SYSTEM — "signal": a broadcast-console read on dark UI.
   One job: tell you which signal to tune into. The accent color
   (cyan) and the ping motif both come from that idea, used once
   as the signature (live badge + logo mark) and nowhere else as
   decoration. No paper, no marquee bulbs, no collegiate poster type.
   ============================================================ */
:root{
  --bg:#0A0C11;
  --surface:#12151D;
  --surface-2:#1A1F29;
  --border:#242A37;
  --border-soft:#1B2029;
  --text:#EEF1F6;
  --text-dim:#828C9E;
  --text-faint:#565F70;
  --accent:#59E9CB;
  --accent-ink:#08211D;
  --accent-soft:rgba(89,233,203,0.12);
  --live:#FF5A78;
  --live-soft:rgba(255,90,120,0.14);
  --radius-lg:20px;
  --radius:14px;
  --radius-sm:9px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;}
body{padding-bottom:env(safe-area-inset-bottom);}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(10,12,17,0.82);backdrop-filter:blur(14px);
  padding:16px 18px 13px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:10px;}
.logo .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);position:relative;}
.logo .dot::before,.logo .dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--accent);opacity:0.5;}
.logo .dot::before{inset:-4px;opacity:0.35;}
.logo .dot::after{inset:-8px;opacity:0.16;}
.logo span{font-size:18px;font-weight:600;letter-spacing:-0.01em;}
.iconbtn{width:44px;height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text);
  display:flex;align-items:center;justify-content:center;font-size:16px;}

/* ---------- sport chips ---------- */
.chiprow{display:flex;gap:6px;padding:16px 18px 8px;overflow-x:auto;scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:9px 15px;min-height:36px;border-radius:999px;background:transparent;border:1px solid var(--border);
  font-size:13px;font-weight:500;letter-spacing:0.01em;color:var(--text-dim);white-space:nowrap;transition:border-color .15s,color .15s,background .15s;}
.chip.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(89,233,203,0.4);}

/* ---------- budget row ---------- */
.budgetrow{display:flex;align-items:center;gap:6px;padding:2px 18px 12px;overflow-x:auto;scrollbar-width:none;}
.budgetrow::-webkit-scrollbar{display:none;}
.budgetrow .budgetlabel{font-size:10.5px;color:var(--text-faint);letter-spacing:0.1em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;flex:0 0 auto;margin-right:2px;}
.budgetchip{flex:0 0 auto;padding:8px 13px;min-height:34px;border-radius:999px;background:transparent;border:1px solid var(--border);
  font-size:12.5px;font-weight:500;color:var(--text-dim);white-space:nowrap;font-family:'IBM Plex Mono',monospace;}
.budgetchip.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(89,233,203,0.4);}

/* ---------- section ---------- */
.section{padding:22px 18px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.section h2{font-size:11px;color:var(--text-faint);letter-spacing:0.14em;margin:0;font-weight:600;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}

/* ---------- schedule scope toggle ---------- */
.scopeToggle{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;}
.scopeBtn{padding:6px 12px;min-height:30px;border-radius:999px;background:transparent;color:var(--text-dim);font-size:11.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
.scopeBtn.active{background:var(--accent-soft);color:var(--accent);}

/* ---------- team grid ---------- */
.teamgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 18px 8px;}
.teamcell{aspect-ratio:1;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--text-dim);
  transition:border-color .15s,background .15s,color .15s;}
.teamcell img{width:28px;height:28px;object-fit:contain;}
.teamcell.active{border-color:rgba(89,233,203,0.5);background:var(--accent-soft);color:var(--accent);}
.favstar{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:rgba(10,12,17,0.55);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-faint);line-height:1;}
.favstar.active{color:#ffc94d;}
#myTeamsToggle{padding:6px 12px;min-height:30px;font-size:11.5px;font-weight:600;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;background:transparent;}
#myTeamsToggle.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(89,233,203,0.4)!important;}

/* ---------- live hero ---------- */
.heroLive{margin:16px 18px;border-radius:var(--radius-lg);overflow:hidden;position:relative;min-height:176px;
  background:linear-gradient(160deg,var(--surface-2),var(--bg) 75%);border:1px solid var(--border);isolation:isolate;}
.heroLive .bgimg{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;opacity:0.22;filter:saturate(0.9) contrast(1.05);
  mask-image:linear-gradient(to top,black,rgba(0,0,0,0.15));}
.heroLive .content{position:relative;padding:20px 18px 18px;display:flex;flex-direction:column;justify-content:flex-end;min-height:176px;}
.livepill{display:inline-flex;align-items:center;gap:7px;background:var(--live-soft);color:var(--live);font-size:11px;font-weight:600;
  padding:5px 10px 5px 8px;border-radius:999px;width:fit-content;margin-bottom:10px;letter-spacing:0.06em;font-family:'IBM Plex Mono',monospace;
  border:1px solid rgba(255,90,120,0.3);}
.livepill .pulse{width:6px;height:6px;border-radius:50%;background:var(--live);position:relative;}
.livepill .pulse::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--live);animation:ping 1.6s cubic-bezier(0,0,0.2,1) infinite;}
@keyframes ping{0%{transform:scale(0.6);opacity:0.8;}100%{transform:scale(2.2);opacity:0;}}
.heroLive h3{font-size:26px;margin:0 0 4px;font-weight:600;}
.heroLive p{margin:0;color:var(--text-dim);font-size:12.5px;font-family:'IBM Plex Mono',monospace;}

/* ---------- game card list ---------- */
.gamecard{margin:0 18px 8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;display:flex;align-items:center;gap:12px;transition:border-color .15s;}
.gamecard:has(.netbadge.live){border-color:rgba(255,90,120,0.4);}
.gamecard .teams{flex:1;min-width:0;}
.gamecard .matchup{font-size:15.5px;font-weight:600;font-family:'Space Grotesk',sans-serif;letter-spacing:-0.005em;}
.gamecard .meta{font-size:12px;color:var(--text-dim);margin-top:3px;font-family:'IBM Plex Mono',monospace;}
.netbadge{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);white-space:nowrap;font-family:'IBM Plex Mono',monospace;}
.netbadge.live{background:var(--live-soft);color:var(--live);border-color:rgba(255,90,120,0.35);}

/* ---------- detail sheet (game / how to watch) ---------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(5,6,9,0.7);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;}
.sheet-backdrop.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:88vh;overflow-y:auto;
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:32px;height:4px;border-radius:2px;background:var(--border);margin:10px auto 4px;}
.sheet-header{padding:10px 20px 16px;border-bottom:1px solid var(--border-soft);}
.sheet-header .matchup{font-size:21px;}
.sheet-header .meta{color:var(--text-dim);font-size:12.5px;margin-top:4px;font-family:'IBM Plex Mono',monospace;}

/* access list: how to watch — a flat data list, not a ticket stub */
.ticket{margin:16px 18px 0;border-radius:var(--radius);background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}
.optionrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-soft);}
.optionrow:last-child{border-bottom:none;}
.optionrow.overbudget{opacity:0.4;}
.optionrow.clickable{cursor:pointer;}
.optionrow.clickable:active{background:var(--surface-2);}
.teamlink{cursor:pointer;border-bottom:1px dashed transparent;transition:border-color .15s,color .15s;}
.teamlink:hover, .teamlink:active{color:var(--accent);border-color:var(--accent);}
.venuelink{color:inherit;border-bottom:1px dashed var(--text-faint);}
.venuelink:hover, .venuelink:active{color:var(--accent);border-color:var(--accent);}
.optionrow .netchip{width:46px;height:46px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;flex-shrink:0;font-family:'IBM Plex Mono',monospace;letter-spacing:0.02em;text-align:center;line-height:1.05;padding:2px;}
.optionrow .info{flex:1;min-width:0;}
.optionrow .label{font-size:14px;font-weight:600;color:var(--text);}
.optionrow .sub{font-size:13px;color:var(--text-dim);margin-top:2px;}
.pricepill{font-size:14px;font-weight:700;padding:6px 11px;border-radius:7px;font-family:'IBM Plex Mono',monospace;border:1px solid transparent;}
.pricepill.free{background:var(--accent-soft);color:var(--accent);border-color:rgba(89,233,203,0.3);}
.pricepill.paid{background:var(--surface);color:var(--text-dim);border-color:var(--border);}
.cheapesttag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--accent);
  background:var(--accent-soft);padding:3px 8px;border-radius:5px;margin-bottom:4px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;}
.goBtn{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 14px;min-height:36px;font-size:13px;font-weight:600;transition:border-color .15s,color .15s;}
.goBtn:hover{border-color:var(--accent);color:var(--accent);}
.budgetnote{padding:12px 16px;font-size:12.5px;color:var(--text-dim);text-align:center;border-top:1px solid var(--border-soft);}
.budgetnote button{color:var(--accent);font-weight:600;text-decoration:underline;padding:0;}
.verified{padding:14px 20px 4px;font-size:11px;color:var(--text-faint);display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;}
.disclosure{padding:0 20px 22px;font-size:10.5px;color:var(--text-faint);line-height:1.4;}

/* ---------- auth sheet ---------- */
.authform{padding:16px 20px 24px;}
.authtabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;margin-bottom:18px;}
.authtab{flex:1;padding:9px 0;border-radius:999px;background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;}
.authtab.active{background:var(--accent-soft);color:var(--accent);}
.authfield{margin-bottom:12px;}
.authfield label{display:block;font-size:11px;color:var(--text-faint);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
.authfield input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;
  font-size:15px;color:var(--text);font-family:inherit;}
.authfield input:focus{outline:none;border-color:var(--accent);}
.authbtn{width:100%;min-height:46px;border-radius:10px;background:var(--accent);color:#04231d;font-size:14px;font-weight:700;margin-top:4px;}
.authbtn:disabled{opacity:0.5;}
.googleBtn{width:100%;min-height:46px;border-radius:10px;background:#fff;color:#1f1f1f;font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;border:1px solid var(--border);}
.authdivider{display:flex;align-items:center;gap:10px;color:var(--text-faint);font-size:11px;margin:16px 0;text-transform:uppercase;letter-spacing:0.08em;font-family:'IBM Plex Mono',monospace;}
.authdivider::before,.authdivider::after{content:"";flex:1;height:1px;background:var(--border);}
.autherror{background:rgba(255,90,120,0.12);border:1px solid rgba(255,90,120,0.35);color:#ff8fa3;font-size:12.5px;
  padding:10px 12px;border-radius:8px;margin-bottom:12px;}
.authmsg{background:var(--accent-soft);border:1px solid rgba(89,233,203,0.35);color:var(--accent);font-size:12.5px;
  padding:10px 12px;border-radius:8px;margin-bottom:12px;}
.accountmenu{padding:8px 20px 22px;}
.accountmenu .whoami{font-size:13px;color:var(--text-dim);padding:10px 4px 16px;border-bottom:1px solid var(--border-soft);margin-bottom:8px;word-break:break-all;}
.accountmenu button.signout{width:100%;min-height:46px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:600;}

/* ---------- empty / loading ---------- */
.loading, .empty{padding:44px 18px;text-align:center;color:var(--text-dim);font-size:14px;}
.spinner{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);
  animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  .livepill .pulse::before, .spinner{animation:none;}
  .sheet{transition:none;}
}

.footNote{padding:26px 18px 40px;font-size:11px;color:var(--text-faint);text-align:center;line-height:1.6;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="dot"></span><span class="display">Watch Guide</span></div>
  <button class="iconbtn" id="accountBtn" aria-label="Account">👤</button>
</div>

<div class="chiprow" id="sportChips"></div>
<div class="budgetrow" id="budgetRow"></div>

<div class="section"><h2>Teams</h2><button class="scopeBtn" id="myTeamsToggle" style="border:1px solid var(--border);border-radius:999px;">★ My teams</button></div>
<div class="teamgrid" id="teamGrid"></div>

<div id="heroSlot"></div>

<div class="section" id="gamesHeader" style="display:none;"><h2 id="gamesTitle">Upcoming</h2></div>
<div id="gamesList" aria-live="polite"></div>

<div class="footNote">
  Schedule &amp; broadcast network data is pulled live from ESPN's public scoreboard feed.
  "How to watch" pricing is reference data we verify by hand — each option shows the date it was last checked, not a live price.
</div>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div id="sheetContent"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
/* ============================================================
   CONFIG — swap in your project's values from Supabase dashboard
   Settings → API. The anon key is safe to expose client-side;
   RLS policies (see schema.sql) control what it can actually do.
============================================================ */
const SUPABASE_URL = 'https://xkgwtvawbhvtqnrnoyrf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrZ3d0dmF3Ymh2dHFucm5veXJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MjIzNjUsImV4cCI6MjEwMjE5ODM2NX0.sCm4Xs6Y7OstqoluEECUegnAX9TQ_bazuOeXyvHcdUw';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ============================================================
   SPORTS CONFIG — extensible. NFL wired to ESPN's free public
   scoreboard API (no key required, same data espn.com uses).
============================================================ */
const SPORTS = {
  nfl: {
    label: 'NFL',
    espnPath: 'football/nfl',
    teams: [
      ['ARI','Cardinals'],['ATL','Falcons'],['BAL','Ravens'],['BUF','Bills'],
      ['CAR','Panthers'],['CHI','Bears'],['CIN','Bengals'],['CLE','Browns'],
      ['DAL','Cowboys'],['DEN','Broncos'],['DET','Lions'],['GB','Packers'],
      ['HOU','Texans'],['IND','Colts'],['JAX','Jaguars'],['KC','Chiefs'],
      ['LAC','Chargers'],['LAR','Rams'],['LV','Raiders'],['MIA','Dolphins'],
      ['MIN','Vikings'],['NE','Patriots'],['NO','Saints'],['NYG','Giants'],
      ['NYJ','Jets'],['PHI','Eagles'],['PIT','Steelers'],['SEA','Seahawks'],
      ['SF','49ers'],['TB','Buccaneers'],['TEN','Titans'],['WSH','Commanders'],
    ]
  }
};

const BUDGET_KEY = 'wg_budget_max_v1';
function loadBudget(){
  try{ const v = localStorage.getItem(BUDGET_KEY); return v===null ? null : JSON.parse(v); }
  catch(e){ return null; }
}
function saveBudget(v){
  try{ localStorage.setItem(BUDGET_KEY, JSON.stringify(v)); }catch(e){}
}
const BUDGET_TIERS = [
  { label:'Any', max:null },
  { label:'Free', max:0 },
  { label:'Under $10', max:10 },
  { label:'Under $20', max:20 },
  { label:'Under $40', max:40 },
];

let state = { sport:'nfl', team:null, scheduleMode:'week', networks:[], accessOptions:[], budgetMax: loadBudget(), user: null, favoriteTeams: new Set(), showOnlyFavorites: false };

/* ---------------- auth ----------------
   Google sign-in requires the Google provider to be turned on in your
   Supabase dashboard (Authentication → Providers → Google) with your own
   Google Cloud OAuth client ID/secret — that's tied to your accounts and
   isn't something that can be set from here. Email/password works out of
   the box with just the anon key already in this file. */
function renderAccountBtn(){
  const btn = document.getElementById('accountBtn');
  if(state.user){
    const initial = (state.user.email||'?')[0].toUpperCase();
    btn.textContent = initial;
    btn.style.fontSize = '15px';
    btn.style.fontWeight = '700';
    btn.setAttribute('aria-label', 'Account — signed in as '+(state.user.email||''));
  }else{
    btn.textContent = '👤';
    btn.style.fontSize = '16px';
    btn.style.fontWeight = '400';
    btn.setAttribute('aria-label', 'Sign in');
  }
}

function openAccountMenu(){
  const content = document.getElementById('sheetContent');
  content.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-header"><div class="matchup display" style="font-size:18px;">Account</div></div>
    <div class="accountmenu">
      <div class="whoami">Signed in as ${escapeHtml(state.user.email||'')}</div>
      <button class="signout" id="signOutBtn">Sign out</button>
    </div>`;
  document.getElementById('signOutBtn').onclick = async ()=>{
    if(!sb) return;
    await sb.auth.signOut();
    closeSheet();
  };
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

function openAuth(mode){
  if(!sb){
    alert('Sign-in isn\'t available right now — the backend connection is down.');
    return;
  }
  let activeMode = mode || 'signin';

  function render(errorMsg, infoMsg){
    const content = document.getElementById('sheetContent');
    content.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="sheet-header"><div class="matchup display" style="font-size:18px;">${activeMode==='signup' ? 'Create account' : 'Sign in'}</div></div>
      <div class="authform">
        ${errorMsg ? `<div class="autherror">${escapeHtml(errorMsg)}</div>` : ''}
        ${infoMsg ? `<div class="authmsg">${escapeHtml(infoMsg)}</div>` : ''}
        <button class="googleBtn" id="googleBtn">

async function loadFavorites(){
  if(!sb || !state.user){ state.favoriteTeams = new Set(); return; }
  try{
    const { data, error } = await sb.from('favorite_teams').select('team_abbr').eq('sport', state.sport);
    if(error) throw error;
    state.favoriteTeams = new Set((data||[]).map(r=>r.team_abbr));
  }catch(e){

  }
  renderTeams();
}

async function toggleFavorite(abbr){
  if(!sb) return;
  if(!state.user){ openAuth('signin'); return; }
  const isFav = state.favoriteTeams.has(abbr);
  // optimistic update — flip it locally first, roll back if the write fails
  if(isFav) state.favoriteTeams.delete(abbr); else state.favoriteTeams.add(abbr);
  renderTeams();
  try{
    if(isFav){
      const { error } = await sb.from('favorite_teams').delete()
        .eq('user_id', state.user.id).eq('sport', state.sport).eq('team_abbr', abbr);
      if(error) throw error;
    }else{
      const { error } = await sb.from('favorite_teams').insert({ user_id: state.user.id, sport: state.sport, team_abbr: abbr });
      if(error) throw error;
    }
  }catch(e){
    console.warn('Could not save favorite', e);
    if(isFav) state.favoriteTeams.add(abbr); else state.favoriteTeams.delete(abbr); // roll back
    renderTeams();
  }
}

/* ---------------- affiliate link config ----------------
   Fill in real tracking IDs from each program once you're approved
   (Amazon Associates for Prime Video, Impact/CJ for Sling/Hulu/fuboTV,
   NFL+'s own partner program, etc.) — every program has its own signup
   and its own param format, so these have to be real values you get
   from each one; I can't generate working affiliate IDs.
   Keyed the same way as BRAND_STYLES below (display_name, lowercased,
   letters+digits only). A network with no entry here just uses its
   plain signup_url from Supabase, untouched. */
const AFFILIATE_PARAMS = {
  // amazonprimevideo: { param:'tag',       value:'YOUR-AMAZON-ASSOCIATES-TAG-20' },
  // hulu:              { param:'irclickid', value:'YOUR-IMPACT-CLICK-ID' },
  // sling:             { param:'irclickid', value:'YOUR-IMPACT-CLICK-ID' },
  // fubo:              { param:'irclickid', value:'YOUR-IMPACT-CLICK-ID' },
  // paramountplus:     { param:'aid',        value:'YOUR-PARAMOUNT-AFFILIATE-ID' },
};
function withAffiliateParams(url, net){
  if(!url) return url;
  const key = (net.display_name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const cfg = AFFILIATE_PARAMS[key];
  if(!cfg) return url;
  try{
    const u = new URL(url);
    u.searchParams.set(cfg.param, cfg.value);
    return u.href;
  }catch(e){ return url; } // malformed URL — just skip affiliate params, safeUrl() handles it downstream
}

/* ============================================================
   OUTPUT SANITIZING — every value below can originate from a
   remote source (ESPN's API, or Supabase rows if RLS is ever
   misconfigured or a row gets edited by someone with dashboard
   access). Never trust it going into innerHTML unescaped.
============================================================ */
function escapeHtml(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}
// Only allow http/https URLs into href/src — blocks javascript:, data:, etc.
function safeUrl(url){
  if(!url) return '';
  try{
    const u = new URL(url, window.location.href);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
  }catch(e){ return ''; }
}
// Only allow real hex colors into inline style attributes.
function safeColor(c){
  return /^#[0-9a-fA-F]{3,8}$/.test(c||'') ? c : null;
}

/* ============================================================
   LOCAL CACHE — localStorage, stale-while-revalidate.
   Cuts ESPN/Supabase calls way down: cached data renders
   instantly, a background refresh only fires once the entry's
   TTL has actually expired. Falls back to stale data (rather
   than an error state) if a refresh fetch fails, e.g. offline.
============================================================ */
const CACHE_PREFIX = 'wg_cache_v1_';
function cacheGet(key){
  try{
    const raw = localStorage.getItem(CACHE_PREFIX+key);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    return { age: Date.now()-parsed.t, data: parsed.d };
  }catch(e){ return null; }
}
function cacheSet(key, data){
  try{ localStorage.setItem(CACHE_PREFIX+key, JSON.stringify({t:Date.now(), d:data})); }
  catch(e){ /* storage full/unavailable — fine, just skip caching */ }
}

/* ---------------- fetch: ESPN scoreboard (live, free, no key) ---------------- */
const SCOREBOARD_TTL_LIVE = 25 * 1000;        // a game's in progress — refresh often
const SCOREBOARD_TTL_IDLE = 4 * 60 * 1000;     // nothing live — schedules rarely move minute to minute

async function fetchScoreboard(){
  const sport = SPORTS[state.sport];
  const cacheKey = 'scoreboard_' + state.sport;
  const cached = cacheGet(cacheKey);
  if(cached){
    const hasLive = cached.data.some(g=>g.status==='in');
    const ttl = hasLive ? SCOREBOARD_TTL_LIVE : SCOREBOARD_TTL_IDLE;
    if(cached.age < ttl) return cached.data;
  }
  const url = `https://site.api.espn.com/apis/site/v2/sports/${sport.espnPath}/scoreboard`;
  let res;
  try{
    res = await fetch(url);
  }catch(networkErr){
    if(cached) return cached.data; // offline/blocked — serve what we have
    throw networkErr;
  }
  if(!res.ok){
    if(cached) return cached.data; // serve stale rather than break the UI
    throw new Error('ESPN scoreboard fetch failed: ' + res.status);
  }
  const data = await res.json();
  const games = (data.events || []).map(ev=>{
    const comp = ev.competitions?.[0];
    const broadcasts = comp?.broadcasts?.flatMap(b=>b.names) || [];
    const competitors = comp?.competitors || [];
    const home = competitors.find(c=>c.homeAway==='home');
    const away = competitors.find(c=>c.homeAway==='away');
    return {
      id: ev.id,
      name: ev.name,
      date: ev.date,
      status: ev.status?.type?.state, // 'pre' | 'in' | 'post'
      statusDetail: ev.status?.type?.shortDetail,
      home: home?.team, away: away?.team,
      homeScore: home?.score, awayScore: away?.score,
      broadcasts,
      venue: comp?.venue?.fullName,
      image: comp?.competitors?.[0]?.team?.logos?.[0]?.href
    };
  });
  cacheSet(cacheKey, games);
  return games;
}

/* ---------------- fetch: ESPN full-season team schedule ----------------
   Different endpoint from the scoreboard above (site.api.espn.com/.../teams/
   {abbr}/schedule), used only once a team is selected and "Full season" is
   toggled — the scoreboard endpoint only ever returns the current week.
   NOTE: this endpoint's exact JSON shape hasn't been live-verified in this
   environment (no outbound network access here) — the parsing below is
   written defensively with fallbacks based on documented community usage,
   but should be spot-checked against a real response and adjusted if a
   field comes back empty/undefined. */
const TEAM_SCHEDULE_TTL = 6 * 60 * 60 * 1000; // full-season schedule barely moves; broadcasts can still get added/changed

function currentNflSeasonYear(){
  const now = new Date();
  // NFL "season" is labeled by the year it starts (games play into the
  // following Jan/Feb but are still the prior year's season).
  return now.getMonth() >= 2 ? now.getFullYear() : now.getFullYear() - 1; // month 2 = March
}

async function fetchTeamSchedule(teamAbbr){
  const sport = SPORTS[state.sport];
  const year = currentNflSeasonYear();
  const cacheKey = `teamschedule_${state.sport}_${teamAbbr}_${year}`;
  const cached = cacheGet(cacheKey);
  if(cached && cached.age < TEAM_SCHEDULE_TTL) return cached.data;

  const url = `https://site.api.espn.com/apis/site/v2/sports/${sport.espnPath}/teams/${teamAbbr.toLowerCase()}/schedule?season=${year}&seasontype=2`;
  let res;
  try{
    res = await fetch(url);
  }catch(networkErr){
    if(cached) return cached.data;
    throw networkErr;
  }
  if(!res.ok){
    if(cached) return cached.data;
    throw new Error('ESPN team schedule fetch failed: ' + res.status);
  }
  const data = await res.json();
  const games = (data.events || []).map(ev=>{
    const comp = ev.competitions?.[0];
    // Broadcasts have shown up under a couple of different shapes across
    // ESPN's "site" API family — try the scoreboard shape first, then fall
    // back to a media/type shortName shape.
    const rawBroadcasts = comp?.broadcasts || ev.broadcasts || [];
    const broadcasts = rawBroadcasts.flatMap(b =>
      b.names || (b.media?.shortName ? [b.media.shortName] : (b.type?.shortName ? [b.type.shortName] : []))
    ).filter(Boolean);
    const competitors = comp?.competitors || [];
    const home = competitors.find(c=>c.homeAway==='home');
    const away = competitors.find(c=>c.homeAway==='away');
    return {
      id: ev.id,
      name: ev.name,
      date: ev.date,
      status: ev.status?.type?.state || comp?.status?.type?.state,
      statusDetail: ev.status?.type?.shortDetail || comp?.status?.type?.shortDetail,
      home: home?.team, away: away?.team,
      homeScore: home?.score, awayScore: away?.score,
      broadcasts,
      venue: comp?.venue?.fullName,
      image: comp?.competitors?.[0]?.team?.logos?.[0]?.href
    };
  });
  cacheSet(cacheKey, games);
  return games;
}

/* ---------------- fetch: Supabase reference data ---------------- */
const REFERENCE_TTL = 12 * 60 * 60 * 1000; // hand-verified pricing barely changes day to day

async function loadReferenceData(){
  if(!sb) return;
  const cacheKey = 'reference_' + state.sport;
  const cached = cacheGet(cacheKey);
  if(cached){
    state.networks = cached.data.networks;
    state.accessOptions = cached.data.accessOptions;
    if(cached.age < REFERENCE_TTL) return; // fresh enough, skip the network round trip
  }
  try{
    const [{data:networks}, {data:opts}] = await Promise.all([
      sb.from('networks').select('*'),
      sb.from('access_options').select('*').order('sort_order')
    ]);
    state.networks = networks || [];
    state.accessOptions = opts || [];
    cacheSet(cacheKey, { networks: state.networks, accessOptions: state.accessOptions });
  }catch(e){
    if(!cached) console.warn('Supabase reference data unavailable', e);
    // else: silently keep serving the cached copy
  }
}

function networkForBroadcastName(name){
  const target = (name||'').toLowerCase().trim();
  if(!target) return null;
  // exact match first (avoids false positives like "ESPN" matching "ESPN2")
  const exact = state.networks.find(n => (n.espn_match_names||[]).some(m => m.toLowerCase() === target));
  if(exact) return exact;
  // fallback: loose match either direction, so "NFL Net" <-> "NFL Network",
  // "ESPN" (regular season) <-> "ESPN2"/"ESPN News" style preseason variants, etc.
  return state.networks.find(n => (n.espn_match_names||[]).some(m=>{
    const match = m.toLowerCase();
    return target.includes(match) || match.includes(target);
  })) || null;
}

}

/* ---------------- game detail sheet: "how to watch" ticket ---------------- */
function openGame(g){
  const content = document.getElementById('sheetContent');
  const dt = new Date(g.date);
  const timeStr = dt.toLocaleString('en-US',{weekday:'long', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});

  const options = [];
  g.broadcasts.forEach(name=>{
    const net = networkForBroadcastName(name);
    if(!net) return;
    const accessRows = state.accessOptions.filter(o=>o.network_id===net.id).sort((a,b)=>(a.monthly_cost_usd??0)-(b.monthly_cost_usd??0));
    accessRows.forEach(o=>options.push({net,o}));
  });

  content.innerHTML = `
    <div class="sheet-header">
      <div class="matchup display">
        <span class="teamlink" data-team="${escapeHtml(g.away?.abbreviation||'')}">${escapeHtml(g.away?.displayName||g.away?.abbreviation)}</span>
        @
        <span class="teamlink" data-team="${escapeHtml(g.home?.abbreviation||'')}">${escapeHtml(g.home?.displayName||g.home?.abbreviation)}</span>
      </div>
      <div class="meta">${escapeHtml(g.status==='in' ? g.statusDetail : timeStr)}${g.venue ? ' · <a class="venuelink" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(g.venue)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(g.venue)+'</a>' : ''}</div>
    </div>
    <div class="ticket">
      ${options.length === 0 ? (
        g.broadcasts.length === 0
          ? `<div class="empty">TV broadcast hasn't been announced yet for this game. Check back closer to kickoff.</div>`
          : `<div class="empty">No verified "how to watch" info yet for ${escapeHtml(g.broadcasts.join(', '))}.</div>`
      ) :
        options.map(({net,o})=>{
          const color = safeColor(net.brand_color) || 'var(--accent)';
          const goUrl = safeUrl(withAffiliateParams(o.signup_url, net));
          const brand = brandStyleFor(net);
          const chipStyle = brand ? `background:${brand.bg};color:${brand.fg};border-color:${brand.bg}` : `color:${color}`;
          const chipLabel = brand ? brand.label : (net.display_name||'').slice(0,4).toUpperCase();
          const cost = o.monthly_cost_usd ?? 0;
          const overBudget = state.budgetMax !== null && cost > state.budgetMax;
          return `
          <div class="optionrow ${overBudget ? 'overbudget' : ''} ${goUrl ? 'clickable' : ''}" ${goUrl ? `data-url="${goUrl}"` : ''}>
            <div class="netchip" style="${chipStyle}">${escapeHtml(chipLabel)}</div>
            <div class="info">
              ${o.is_cheapest ? `<div class="cheapesttag">CHEAPEST</div>` : ''}
              <div class="label">${escapeHtml(o.label)}</div>
              <div class="sub">${escapeHtml(o.notes || net.display_name)}${overBudget ? ' · over your budget' : ''}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
              <span class="pricepill ${(!o.monthly_cost_usd)?'free':'paid'}">${o.monthly_cost_usd ? '$'+escapeHtml(o.monthly_cost_usd)+'/mo' : 'Free'}</span>
              ${goUrl ? `<a class="goBtn" href="${goUrl}" target="_blank" rel="noopener noreferrer">Open</a>` : ''}
            </div>
          </div>
        `;}).join('')
      }
    </div>
    <div class="verified">🕓 Pricing last verified ${escapeHtml(options[0]?.o.last_verified || '—')}. Prices change — always confirm at signup.</div>
    ${options.length > 0 ? `<div class="disclosure">Some links above may be affiliate links — we may earn a commission if you sign up, at no extra cost to you.</div>` : ''}
  `;
  content.querySelectorAll('.optionrow[data-url]').forEach(row=>{
    row.onclick = (e)=>{
      if(e.target.closest('a')) return; // let the Open link's own click/target=_blank handle it
      window.open(row.dataset.url, '_blank', 'noopener,noreferrer');
    };
  });
  content.querySelectorAll('.teamlink[data-team]').forEach(el=>{
    if(!el.dataset.team) return;
    el.onclick = ()=>{
      state.team = el.dataset.team;
      state.scheduleMode = 'season';
      closeSheet();
      renderTeams();
      loadGames();
      document.getElementById('teamGrid').scrollIntoView({behavior:'smooth', block:'start'});
    };
  });
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
document.getElementById('backdrop').onclick = closeSheet;
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('sheet').classList.contains('open')) closeSheet();
});
function closeSheet(){
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

/* ---------------- orchestration ---------------- */
async function loadGames(){
  document.getElementById('gamesHeader').style.display='block';
  document.getElementById('gamesList').innerHTML = `<div class="loading"><div class="spinner"></div>Loading live schedule…</div>`;
  try{
    let games;
    if(state.team && state.scheduleMode==='season'){
      games = await fetchTeamSchedule(state.team);
    }else{
      games = await fetchScoreboard();
      if(state.team){
        games = games.filter(g => g.home?.abbreviation===state.team || g.away?.abbreviation===state.team);
      }
    }
    renderHero(games);
    renderGames(games);
  }catch(e){
    console.error(e);
    document.getElementById('gamesList').innerHTML = `<div class="empty">Couldn't reach the live schedule. Check your connection and pull to refresh.</div>`;
  }
}

async function renderAll(){
  renderChips();
  renderBudgetRow();
  renderTeams();
  await loadReferenceData();
  await loadGames();
}

renderAll();
</script>
</body>
</html>
